name: deploy

# Por que este workflow existe: em 05/08/2026 o FortiGate da rede do escritório passou a
# devolver 403 (Web Filter) para as portas web de easypanel.sinteseia.com.br — inclusive
# batendo direto no IP, então não dá para contornar por SNI. A porta 5432 do mesmo host passa,
# o que confirma que o filtro é sobre HTTP(S), não sobre o servidor.
#
# O runner do GitHub não está atrás desse filtro. Então o deploy sai daqui.
#
# Só `workflow_dispatch`: o repositório é público e o token do Easypanel é um segredo. Rodar
# em push ou em pull_request abriria caminho para um PR de fora tentar alcançá-lo.
#
#   gh workflow run deploy -R sintese-ia/comunidade-cells

on:
  workflow_dispatch:
    inputs:
      apenas_deploy:
        description: 'Pular a configuração de origem/build e só redeployar'
        type: boolean
        default: false
      marcador:
        description: 'Trecho que só existe no código novo, para provar que ele subiu'
        type: string
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BASE: https://easypanel.sinteseia.com.br/api/trpc
      PROJ: sintese
      SVC: comunidade-cells
      TOKEN: ${{ secrets.EASYPANEL_API_TOKEN }}
    steps:
      - name: checar token
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secret EASYPANEL_API_TOKEN não está configurado no repositório"
            exit 1
          fi

      - name: painel responde daqui?
        run: |
          code=$(curl -k -s -o /dev/null -w '%{http_code}' -m 20 https://easypanel.sinteseia.com.br || true)
          echo "easypanel → HTTP $code"
          [ "$code" = "200" ] || { echo "::error::painel inacessível também do runner (HTTP $code)"; exit 1; }

      - name: env vars
        if: ${{ !inputs.apenas_deploy }}
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          PANEL_SENHA: ${{ secrets.PANEL_SENHA }}
        run: |
          # META_APP_SECRET pode estar vazio: sem ele o webhook de story recusa POST de propósito,
          # mas o resto do painel funciona. Assim que o secret existir, rodar de novo.
          [ -n "$META_APP_SECRET" ] || echo "::warning::META_APP_SECRET vazio — webhook de story vai recusar POST"
          ENV=$(printf '%s\n' \
            "DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@bancodados:5432/dadoscells" \
            "META_TOKEN=${META_TOKEN}" \
            "APIFY_TOKEN=${APIFY_TOKEN}" \
            "META_VERIFY_TOKEN=${META_VERIFY_TOKEN}" \
            "META_APP_SECRET=${META_APP_SECRET}" \
            "IG_USER_ID=17841405730329135" \
            "SENHA=${PANEL_SENHA}" \
            "CACHE_MIN=5" "PORT=3000" "NODE_ENV=production")
          jq -n --arg p "$PROJ" --arg s "$SVC" --arg e "$ENV" \
            '{json:{projectName:$p,serviceName:$s,env:$e}}' > /tmp/env.json
          curl -sS -X POST "$BASE/services.app.updateEnv" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d @/tmp/env.json -o /dev/null -w 'HTTP %{http_code}\n'
          rm -f /tmp/env.json

      - name: origem do código
        if: ${{ !inputs.apenas_deploy }}
        run: |
          curl -sS -X POST "$BASE/services.app.updateSourceGit" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"json\":{\"projectName\":\"$PROJ\",\"serviceName\":\"$SVC\",\"repo\":\"https://github.com/sintese-ia/comunidade-cells.git\",\"ref\":\"main\",\"path\":\"/\"}}" \
            -w '\nHTTP %{http_code}\n'

      - name: build por Dockerfile
        if: ${{ !inputs.apenas_deploy }}
        run: |
          curl -sS -X POST "$BASE/services.app.updateBuild" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"json\":{\"projectName\":\"$PROJ\",\"serviceName\":\"$SVC\",\"build\":{\"type\":\"dockerfile\",\"file\":\"Dockerfile\"}}}" \
            -w '\nHTTP %{http_code}\n'

      - name: deploy
        run: |
          curl -sS -X POST "$BASE/services.app.deployService" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"json\":{\"projectName\":\"$PROJ\",\"serviceName\":\"$SVC\"}}" \
            -w '\nHTTP %{http_code}\n'

      - name: esperar o CÓDIGO NOVO subir
        env:
          PANEL_SENHA: ${{ secrets.PANEL_SENHA }}
          MARCA: ${{ inputs.marcador }}
        run: |
          # ⚠️ Esperar por HTTP 401 NÃO PROVA NADA: o container ANTIGO também devolve 401, e o
          # Easypanel faz rollover sem derrubar o antigo. Em 08/08 este passo disse "no ar" em
          # 0,5s lendo a versão velha. Então agora ele faz login e procura um marcador que só
          # existe no código novo.
          URL=https://comunidade-cells.sinteseia.com.br
          M="${MARCA:-data-mod=\"analises\"}"
          echo "procurando: $M"
          for i in $(seq 1 40); do
            c=$(curl -k -s -o /dev/null -w '%{http_code}' -m 10 "$URL" || true)
            if [ "$c" = "401" ] && [ -n "$PANEL_SENHA" ]; then
              curl -k -s -m 20 -c /tmp/j -X POST -d "senha=$PANEL_SENHA" "$URL" -o /dev/null || true
              if curl -k -s -m 30 -b /tmp/j "$URL" | grep -qF "$M"; then
                echo "código novo no ar → $URL"
                rm -f /tmp/j; exit 0
              fi
              echo "  $(printf %02d $i)) no ar, mas ainda é a versão anterior"
            else
              printf '  %02d) HTTP %s\n' "$i" "$c"
            fi
            sleep 15
          done
          echo "::error::o código novo não apareceu em ~10 min — ver logs do serviço no painel"
          exit 1
