<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500..800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>Comunidade Cells — seu painel</title>
<style>
  :root{
    /* identidade do site cells.com.br (09/11): papel quente, tinta quase preta, terracota */
    --bg:#FFFFFF;--pg:#FAFAF7;--ink:#0D0D0D;--ink2:#3D3936;--mut:#6B6B6B;--fnt:#9A948C;
    --line:#E3E0DA;--line2:#EFECE6;--ac:#D4541A;--ac-s:#FBEDE4;
    --ok:#217A4B;--ok-s:#E7F2EB;--wa:#9A6A12;--wa-s:#F8F0DD;--ng:#B03A2E;--ng-s:#F9E9E6;
    --vo:#9A948C;--vo-s:#F2F0EC;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    --disp:"Archivo","DM Sans","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--pg);color:var(--ink);font-family:var(--sans);font-size:15px;
       line-height:1.55;-webkit-font-smoothing:antialiased}

  /* ---------- esqueleto: menu lateral + conteúdo ---------- */
  .app{display:flex;min-height:100vh;align-items:flex-start}
  .nav{position:sticky;top:0;flex:none;width:216px;height:100vh;background:var(--bg);
       border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column}
  .marca{font-family:var(--disp);font-stretch:125%;font-weight:800;font-size:17px;
    letter-spacing:-.01em;padding:0 10px;margin-bottom:2px;text-transform:lowercase}
  .marca em{font-style:normal;color:var(--ac)}
  .quem{padding:0 10px 18px;font-size:12px;color:var(--mut);line-height:1.45}
  .quem b{display:block;color:var(--ink);font-size:14px;font-weight:640}
  .nav a{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:999px;
         color:var(--ink2);text-decoration:none;cursor:pointer;
         font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
         border:0;background:none;width:100%;text-align:left}
  .nav a:hover{background:var(--pg)}
  .nav a.on{background:var(--ink);color:#FAFAF7;font-weight:600}
  .nav a .ic{font-size:14px;width:17px;text-align:center;flex:none}
  .nav a .pt{margin-left:auto;width:6px;height:6px;border-radius:99px;background:var(--wa)}
  .nav .sep{flex:1}
  .nav .sai{color:var(--mut)}

  .conteudo{flex:1;min-width:0;max-width:820px;padding:26px 22px 80px}
  @media(max-width:780px){
    .app{display:block}
    .nav{position:sticky;top:0;z-index:20;width:auto;height:auto;flex-direction:row;
         border-right:0;border-bottom:1px solid var(--line);padding:0;overflow-x:auto;
         gap:2px;-webkit-overflow-scrolling:touch}
    .marca,.quem,.nav .sep{display:none}
    .nav a{width:auto;white-space:nowrap;border-radius:0;padding:13px 12px;
           border-bottom:2px solid transparent}
    .nav a.on{background:none;border-bottom-color:var(--ac)}
    .conteudo{padding:18px 13px 70px}
  }

  h1.tt{margin:0 0 16px;font-family:var(--disp);font-stretch:125%;font-weight:700;
        font-size:clamp(23px,4.5vw,30px);letter-spacing:-.01em;line-height:1.08}
  h1.tt small{display:block;font-family:var(--sans);font-size:13px;color:var(--mut);font-weight:400;
              letter-spacing:0;margin-top:6px}

  /* ---------- seletor de mês ---------- */
  .per{position:sticky;top:0;z-index:5;background:var(--bg);border:1px solid var(--line);
       border-radius:999px;padding:7px 10px;display:flex;align-items:center;gap:8px}
  @media(max-width:780px){.per{top:46px}}
  .per .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
          color:var(--mut);padding-left:4px;flex:none}
  .per select{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;background:var(--pg);
              color:var(--ink);font-family:inherit;font-size:14.5px;font-weight:600;padding:8px 10px;
              text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none;cursor:pointer}
  .per button{flex:none;width:36px;height:36px;border:1px solid var(--line);border-radius:999px;
              background:var(--bg);color:var(--ink);font-size:15px;line-height:1;cursor:pointer}
  .per button:disabled{color:var(--line);cursor:default}
  .per button:focus-visible,.per select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}

  .dois{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
        border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
  .dois > div{background:var(--bg);padding:20px 18px 18px}
  .dois .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
  .dois .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:31px;font-weight:560;
           letter-spacing:-.03em;line-height:1;margin-top:11px}
  .dois .n{font-size:11.5px;color:var(--fnt);margin-top:8px}
  @media(max-width:460px){.dois{grid-template-columns:1fr}.dois .v{font-size:27px}}

  .delta{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:2px;
         background:var(--vo-s);color:var(--mut);white-space:nowrap}
  .delta.up{background:var(--ok-s);color:var(--ok)}
  .delta.down{background:var(--ng-s);color:var(--ng)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;
        background:var(--line);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
  .cel{background:var(--bg);padding:14px 15px}
  .cel .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
  .cel .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:23px;font-weight:520;
          margin-top:7px;line-height:1;letter-spacing:-.02em;white-space:nowrap}
  .cel .v.din{font-size:18px}
  .cel .n{font-size:11px;color:var(--fnt);margin-top:5px}

  section{background:var(--bg);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
  section:first-child{margin-top:0}
  .sh{padding:14px 18px 11px;border-bottom:1px solid var(--line2);display:flex;
      align-items:baseline;gap:10px;flex-wrap:wrap}
  .sh h2{margin:0;font-family:var(--disp);font-stretch:125%;font-size:16px;font-weight:700;letter-spacing:0}
  .sh p{margin:4px 0 0;font-size:12.5px;color:var(--mut);flex-basis:100%}
  .sh .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fnt)}
  .sb{padding:14px 18px}

  .codigo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .codigo input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:999px;padding:10px 16px;
                font-family:var(--mono);font-size:13.5px;background:var(--pg);color:var(--ink)}
  .cp{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
      background:none;color:var(--ink);border:1px solid var(--ink);border-radius:999px;
      padding:10px 18px;cursor:pointer}
  .cp:hover{background:var(--ink);color:#FAFAF7}
  .cp:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

  .lin{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);
       font-size:13px;align-items:baseline}
  .lin:last-child{border-bottom:0}
  .lin .d{font-family:var(--mono);font-size:11px;color:var(--fnt);flex:none;width:74px}
  .lin .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
  .lin .v{font-family:var(--mono);font-variant-numeric:tabular-nums;flex:none;font-weight:600}
  .tag{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;
       padding:2px 6px;border-radius:2px;background:var(--vo-s);color:var(--mut);flex:none}

  .meta{margin-bottom:13px}
  .meta:last-child{margin-bottom:0}
  .meta .mh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .meta .mh b{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .bar{height:6px;background:var(--line2);border-radius:99px;overflow:hidden}
  .bar span{display:block;height:100%;background:var(--ac);border-radius:99px}
  .bar.full span{background:var(--ok)}

  .spark{display:flex;align-items:flex-end;gap:2px;height:64px;margin-top:2px}
  .spark i{flex:1;background:var(--line2);border-radius:1px 1px 0 0;min-height:2px;display:block}
  .spark i.tem{background:var(--ac)}
  .spark i.rs{background:var(--ok)}
  .spark i.fut{background:transparent;border-bottom:2px solid var(--line2)}
  .sparkl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;
          color:var(--fnt);margin-top:6px}

  .niv{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .medalha{font-size:26px;line-height:1}
  .niv .nm{font-size:17px;font-weight:660;letter-spacing:-.015em;text-transform:capitalize}
  .taxas{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);
         border-radius:12px;overflow:hidden;margin-top:13px;flex-wrap:wrap}
  .taxas div{background:var(--bg);padding:11px 13px;flex:1;min-width:120px}
  .taxas .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
  .taxas .v{font-family:var(--mono);font-size:19px;font-weight:560;margin-top:6px;letter-spacing:-.02em}
  .escada{margin-top:14px}
  .escada .et{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px}

  /* ---------- formulários ---------- */
  .cps{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .cps .full{grid-column:1/-1}
  @media(max-width:560px){.cps{grid-template-columns:1fr}}
  .cp2 label{display:block;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;
             text-transform:uppercase;color:var(--mut);margin-bottom:6px}
  .cp2 input,.cp2 select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
                         font-size:14.5px;font-family:inherit;background:var(--bg);color:var(--ink)}
  .cp2 input:focus,.cp2 select:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
  .cp2 input[readonly]{background:var(--pg);color:var(--mut)}
  .cp2 .aj{font-size:11.5px;color:var(--fnt);margin-top:5px;line-height:1.45}
  .acoes{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
  .sv{background:var(--ink);color:#FAFAF7;border:0;border-radius:999px;padding:12px 26px;
      font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  .sv[disabled]{opacity:.5;cursor:default}
  .msg{font-size:13px;font-weight:600}
  .msg.ok{color:var(--ok)} .msg.er{color:var(--ng)}

  .veu{position:fixed;inset:0;background:rgba(13,13,13,.55);display:grid;place-items:center;
    padding:18px;z-index:60}
  .aceite{background:var(--bg);border-top:4px solid var(--ac);border-radius:18px;
    padding:40px 36px;width:min(560px,94vw);box-shadow:0 24px 70px rgba(13,13,13,.35);text-align:center}
  .aceite .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ac);font-weight:600;margin-bottom:14px}
  .aceite h2{margin:0 0 12px;font-family:var(--disp);font-stretch:125%;font-size:clamp(24px,5vw,32px);line-height:1.1;letter-spacing:-.01em;font-weight:700}
  .aceite p{margin:0 auto 22px;font-size:15.5px;color:var(--ink2);line-height:1.6;max-width:42ch}
  .aceite button{appearance:none;border:0;background:var(--ac);color:#fff;border-radius:999px;
    padding:17px 34px;font-family:var(--mono);font-size:13px;letter-spacing:.09em;text-transform:uppercase;
    font-weight:600;cursor:pointer;width:100%}
  .aceite button:hover{background:#B8460F}
  .aceite button:disabled{opacity:.6;cursor:default}
  .aceite .dps{display:inline-block;margin-top:14px;font-size:12.5px;color:var(--fnt);
    background:none;border:0;cursor:pointer;text-decoration:underline;font-family:var(--sans)}
  .aceite .sablab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--mut);margin:4px 0 10px}
  .sabores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 auto 22px;max-width:400px}
  .sabores button{appearance:none;background:var(--bg);border:2px solid var(--line);border-radius:16px;
    padding:14px 12px 16px;cursor:pointer;font-family:var(--sans);color:var(--ink);
    display:grid;gap:10px;justify-items:center;width:auto;text-transform:none;letter-spacing:0}
  .sabores button:hover{background:var(--bg);border-color:var(--mut)}
  .sabores button img{width:100%;max-width:140px;aspect-ratio:1;object-fit:contain;border-radius:10px}
  .sabores button .nm{font-size:14.5px;font-weight:700;line-height:1.25}
  .sabores button .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);
    display:grid;place-items:center;font-size:13px;line-height:1;color:transparent}
  .sabores button[aria-pressed="true"]{border-color:var(--ac);background:var(--ac-s)}
  .sabores button[aria-pressed="true"]:hover{border-color:var(--ac)}
  .sabores button[aria-pressed="true"] .ck{background:var(--ac);border-color:var(--ac);color:#fff}
  .aceite .cupBox{font-family:var(--mono);font-size:clamp(20px,4.5vw,26px);font-weight:600;
    letter-spacing:.06em;border:2px dashed var(--ac);border-radius:14px;padding:16px 20px;
    margin:0 auto 14px;max-width:340px;color:var(--ink)}
  .aceite .mini{font-size:12.5px;color:var(--mut);margin:0 auto 20px;max-width:40ch;line-height:1.5}
  .aceite a.btn{display:block;background:var(--ac);color:#fff;border-radius:999px;text-decoration:none;
    padding:17px 34px;font-family:var(--mono);font-size:13px;letter-spacing:.09em;text-transform:uppercase;
    font-weight:600}
  .aceite a.btn:hover{background:#B8460F}
  .aceite .err{margin-top:10px;font-size:12.5px;color:var(--ng)}
  .passo{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;
    border-bottom:1px solid var(--line2);font-size:13.5px;line-height:1.5;align-items:start}
  .passo:last-child{border-bottom:none}
  .passo .pn{font-family:var(--mono);font-size:11px;color:var(--fnt);padding-top:2px}
  .passo a{color:var(--ac)}
  .aviso{background:var(--wa-s);border-left:3px solid var(--wa);border-radius:3px;
         padding:11px 13px;font-size:12.5px;color:#5B3B00;line-height:1.55;margin-bottom:14px}
  .aviso.info{background:var(--ac-s);border-left-color:var(--ac);color:#0A3D9E}

  .vazio{font-size:13px;color:var(--fnt);padding:4px 0}
  .nota{font-size:11.5px;color:var(--fnt);line-height:1.6}
  footer{margin-top:22px;font-size:11.5px;color:var(--fnt);line-height:1.7;text-align:center}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="menu"></nav>
  <main class="conteudo" id="tela"></main>
</div>
<script>
const P = __DADOS__;
const n  = v => v==null ? '—' : Number(v).toLocaleString('pt-BR');
const rs = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
// escapa também aspas: metade destes valores vai dentro de atributo `value="..."` de input
const esc = s => String(s==null?'':s).replace(/[<>&"']/g,
  m=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[m]));
const pc = x => Number(x||0).toLocaleString('pt-BR',{maximumFractionDigits:1}) + '%';

let aceiteEm = (P.parceiro||{}).aceite_em || null, grupoLink = P.grupo || null;
const p = P.parceiro, vida = P.vendas||{}, ex = P.extrato||[], pubs = P.publicacoes||[],
      env = P.envios||[], jg = P.jogos||[],
      cl = P.cliques||{}, nv = P.nivel||null, faixas = P.faixas||[], camps = P.campanhas||[],
      cupons = P.cupons||[];

const MEDALHA = {ouro:'🥇', prata:'🥈', bronze:'🥉'};
const MES = ['janeiro','fevereiro','março','abril','maio','junho',
             'julho','agosto','setembro','outubro','novembro','dezembro'];

// ⚠️ TODA data aqui é STRING 'YYYY-MM-DD' vinda do servidor, já no fuso de São Paulo.
// Nada de `new Date(...)` para descobrir dia ou mês: o navegador da creator pode estar em
// outro fuso, e um pedido da meia-noite de 31/07 apareceria em agosto na tela dela.
const ymDe   = d => String(d||'').slice(0,7);
const rotulo = ym => MES[+ym.slice(5,7)-1] + ' de ' + ym.slice(0,4);
const curto  = ym => MES[+ym.slice(5,7)-1].slice(0,3) + '/' + ym.slice(2,4);
const dia    = d => String(d||'').slice(8,10)+'/'+String(d||'').slice(5,7);
const dtc    = d => d ? String(d).slice(8,10)+'/'+String(d).slice(5,7)+'/'+String(d).slice(2,4) : '—';
const diasNoMes = ym => new Date(Date.UTC(+ym.slice(0,4), +ym.slice(5,7), 0)).getUTCDate();
const ymAntes = ym => { let a=+ym.slice(0,4), m=+ym.slice(5,7)-1;
  if(!m){m=12;a--;} return a+'-'+String(m).padStart(2,'0'); };

// O link vem PRONTO do servidor (linkDoCreator), curto quando existe redirect. Não montar
// aqui: esta tela montava com `utm_medium=organic`, valor aposentado em 12/08, e entregava
// sempre o link longo — bem na tela onde a creator COPIA o link para divulgar.
const link = p.link || '';

// ⚠️ A lista de meses vem do SERVIDOR e é CONTÍNUA — todo mês desde a entrada dela no
// programa até hoje, inclusive os sem venda. Antes eu montava aqui só com os meses que
// tinham movimento, e o seletor pulava de março para novembro: parecia que o painel tinha
// perdido o meio do ano. Mês zerado é informação — é ele que mostra o buraco.
const ymHoje = ymDe(P.hoje);
const meses = (P.meses && P.meses.length) ? P.meses : [ymHoje];

let sel = meses.includes(ymHoje) ? ymHoje : meses[0];
let aba = (location.hash || '').replace('#','') || 'inicio';

// ---- o que aconteceu num mês ----
// Os totais saem dos MESMOS registros que a lista embaixo mostra. Assim o número grande é,
// por construção, a soma do que está listado — não dá para divergirem.
// ⚠️ `pedidos` é a LISTA (inclui cancelado, para aparecer na tela) e `valem` é o que SOMA.
// Todo total sai de `valem`. Pedido cancelado que continuasse somando viraria comissão paga
// sobre dinheiro que a Cells devolveu ao cliente.
function doMes(ym){
  const pedidos = ex.filter(e => ymDe(e.dia) === ym);
  const valem   = pedidos.filter(e => e.valida !== false);
  const cliques = (cl.serie||[]).filter(d => ymDe(d.dia) === ym);
  const conteudos = pubs.filter(c => ymDe(c.dia) === ym);
  const receita  = valem.reduce((a,e) => a + Number(e.receita_liquida||0), 0);
  const comissao = valem.reduce((a,e) => a + Number(e.comissao||0), 0);
  return { ym, pedidos, valem, cliques, conteudos, receita, comissao,
    cliquesTot: cliques.reduce((a,d) => a + d.cliques, 0),
    novos: valem.filter(e => e.cliente_novo).length,
    assinaturas: valem.filter(e => e.virou_assinatura).length,
    cancelados: pedidos.length - valem.length,
    ticket: valem.length ? receita/valem.length : 0 };
}

// ⚠️ "primeiro mês com venda" só vale se NÃO existe mês anterior com venda em lugar nenhum.
// Olhar só o mês imediatamente anterior chamava novembro/25 do Gabriel de primeiro mês —
// ele já tinha vendido em janeiro, fevereiro e março. Um elogio errado é pior que nenhum.
function delta(ym, atual, anterior){
  if (!atual && !anterior) return '';
  const houveAntes = ex.some(e => e.dia.slice(0,7) < ym && Number(e.receita_liquida) > 0);
  if (!anterior) return !houveAntes ? '<span class="delta up">primeiro mês com venda</span>'
                                    : '<span class="delta">mês anterior sem venda</span>';
  if (!atual) return '<span class="delta down">sem venda neste mês</span>';
  const d = Math.round((atual/anterior - 1) * 100);
  if (!d) return '<span class="delta">igual ao mês anterior</span>';
  return '<span class="delta ' + (d>0?'up':'down') + '">' + (d>0?'+':'') + d + '% vs mês anterior</span>';
}

// barras por dia do mês, com os dias VAZIOS incluídos: sem eles o gráfico encolhe os
// intervalos parados e um pico isolado vira uma linha cheia de atividade.
function barras(ym, valores, classe, fmt){
  const nd = diasNoMes(ym);
  const hoje = ym === ymHoje ? +P.hoje.slice(8,10) : nd;
  const mx = Math.max(1, ...Object.values(valores));
  let html = '<div class="spark">';
  for (let d = 1; d <= nd; d++){
    const k = ym + '-' + String(d).padStart(2,'0');
    const v = valores[k] || 0;
    const futuro = d > hoje;
    html += '<i class="' + (v ? classe : (futuro ? 'fut' : '')) + '" style="height:' +
      (v ? Math.max(7, Math.round(v/mx*100)) : 2) + '%" title="' + d + '/' + ym.slice(5,7) +
      ': ' + fmt(v) + '"></i>';
  }
  return html + '</div><div class="sparkl"><span>1</span><span>' +
    (ym===ymHoje ? 'hoje' : nd) + '</span></div>';
}

      ${campo('gTel','Celular com DDD', tel, {attr:'inputmode="numeric" placeholder="11999998888"'})}
      ${campo('gNasc','Data de nascimento', p.nascimento ? String(p.nascimento).slice(0,10) : '',
        {attr:'type="date"', ajuda: p.nascimento ? '' : (p.idade_declarada
          ? 'Na inscrição você declarou ' + p.idade_declarada + ' anos — a gente perguntou a idade, não a data. Preencha se quiser aparecer no aniversário.'
          : 'A gente nunca perguntou isso. Preencha se quiser.')})}
      ${campo('gIg','Seu @', '@' + (p.instagram_handle||''), {attr:'readonly',
        ajuda:'O @ é a chave que liga você aos seus posts, ao seu link e ao seu cupom. Para trocar, fale com a gente que a gente migra o histórico junto.'})}
    </div>
    <div class="acoes"><button class="sv" id="svPer">Salvar</button>
      <span class="msg" id="msgPer"></span></div>
  </div>
</section>
<section>
  <div class="sh"><h2>Endereço de entrega</h2><p>Para onde vão os envios e brindes.</p></div>
  <div class="sb">
    <div class="cps">
      ${campo('gCep','CEP', p.end_cep || '', {attr:'inputmode="numeric" placeholder="00000000"'})}
      ${campo('gUf','UF', (p.end_uf||'').toUpperCase(), {attr:'maxlength="2" placeholder="SP"'})}
      ${campo('gLog','Rua', p.end_logradouro || '', {full:true})}
      ${campo('gNum','Número', p.end_numero || '')}
      ${campo('gCompl','Complemento', p.end_complemento || '')}
      ${campo('gBai','Bairro', p.end_bairro || '')}
      ${campo('gCid','Cidade', p.end_cidade || '')}
      ${campo('gAc','Aos cuidados de', p.end_aos_cuidados || '', {full:true,
        ajuda:'Quem recebe, se não for você — porteiro, recepção, outro nome na caixa.'})}
    </div>
    <div class="acoes"><button class="sv" id="svEnd">Salvar</button>
      <span class="msg" id="msgEnd"></span></div>
  </div>
</section>
<section>
  <div class="sh"><h2>Como você recebe a comissão</h2>
    <p>O <b>titular da chave</b> tem que ser o mesmo CPF/CNPJ informado aqui — banco recusa
      transferência para chave de terceiro.</p></div>
  <div class="sb">
    ${faltaReceber ? `<div class="aviso">Enquanto isso não estiver preenchido,
      não temos para onde mandar a sua comissão.</div>` : ''}
    <div class="cps">
      ${campo('fTipoDoc','Você recebe como', tipoDoc, {select:[['cpf','Pessoa física (CPF)'],['cnpj','Pessoa jurídica (CNPJ)']]})}
      ${campo('fDoc','CPF/CNPJ do titular', p.cnpj || p.cpf || '', {attr:'inputmode="numeric" placeholder="só números"'})}
      ${campo('fPixTipo','Tipo de chave', p.pix_tipo || 'cpf', {select:[
        ['cpf','CPF'],['cnpj','CNPJ'],['email','E-mail'],['telefone','Telefone'],['aleatoria','Chave aleatória']]})}
      ${campo('fPixChave','Chave PIX', p.pix_chave || '', {attr:'placeholder="a chave, como ela é no banco"'})}
    </div>
    <div class="acoes"><button class="sv" id="svFin">Salvar</button>
      <span class="msg" id="msgFin"></span></div>
    <div style="margin-top:16px;padding-top:13px;border-top:1px solid var(--line2)">
      <div class="aviso info" style="margin-bottom:10px">O desenho do pagamento — janela para
        pedir e data para receber — ainda está sendo fechado pela Cells. Assim que estiver,
        aparece aqui com as datas.</div>
      <p class="nota">A comissão que você vê em <b>Resultados</b> é calculada na taxa do seu
        nível de hoje. Ela é a sua referência do mês, não um saldo já liberado.</p>
    </div>
  </div>
</section>`;
}

// ---------------------------------------------------------------- Acesso
function telaAcesso(){
  const entra = p.email || ('@' + (p.instagram_handle||''));
  return `<h1 class="tt">Acesso.<small>Como você entra neste painel.</small></h1>
<section>
  <div class="sh"><h2>${p.senha_provisoria ? 'Crie sua senha definitiva' : p.tem_senha ? 'Trocar sua senha' : 'Criar sua senha'}</h2>
    <p>${p.senha_provisoria
      ? 'Sua senha atual é provisória — é a parte do seu e-mail antes do @. Crie uma senha nova, só sua, para liberar o resto do painel.'
      : p.tem_senha
      ? 'Você já tem senha. Trocar aqui vale para o próximo login.'
      : 'Hoje você só entra pelo link pessoal que a Cells te manda. Com senha, você entra quando quiser, mesmo depois de o link expirar.'}</p></div>
  <div class="sb">
    <div class="aviso info">Você vai entrar com <b>${esc(entra)}</b> e a senha que criar aqui.
      ${p.email ? '' : 'Preencha seu e-mail em <b>Meus dados</b> se quiser entrar pelo e-mail.'}</div>
    <div class="cps">
      ${p.tem_senha ? campo('sAtual','Senha atual', '', {attr:'type="password" autocomplete="current-password"', full:true}) : ''}
      ${campo('sNova','Nova senha', '', {attr:'type="password" autocomplete="new-password"',
        ajuda:'No mínimo 8 caracteres.'})}
      ${campo('sConf','Repita a nova senha', '', {attr:'type="password" autocomplete="new-password"'})}
    </div>
    <div class="acoes"><button class="sv" id="svSen">${p.tem_senha?'Trocar senha':'Criar senha'}</button>
      <span class="msg" id="msgSen"></span></div>
  </div>
</section>
<section>
  <div class="sh"><h2>Link pessoal</h2></div>
  <div class="sb">
    <p class="nota">O link que a Cells te mandou é <b>só seu</b> e entra direto, sem senha. Por
      isso ele não deve ser repassado nem colado em grupo: quem abrir o link vê os seus números
      e os seus dados. Se achar que ele vazou, crie uma senha e peça um link novo para a gente —
      o antigo é desativado.</p>
  </div>
</section>`;
}

// ================================================================ render
const TELAS = {inicio:telaInicio,
               conteudos:telaConteudos, perfil:telaPerfil, acesso:telaAcesso};

// `#financeiro` virou seção de "Meus dados" em 16/08, mas o hash já saiu em conversa e em
// aviso — quem clicar no link antigo cai na aba certa, não numa tela em branco.
const APELIDO = {financeiro:'perfil', nivel:'inicio', campanhas:'inicio'};

function desenhar(){
  if (APELIDO[aba]) aba = APELIDO[aba];
  // senha provisória: nada abre antes de ela criar a senha definitiva
  if (p.senha_provisoria && aba !== 'acesso') aba = 'acesso';
  if (!TELAS[aba]) aba = 'inicio';
  document.getElementById('menu').innerHTML = menu();
  document.getElementById('tela').innerHTML = TELAS[aba]();
  if (aba === 'inicio'){
    const i = meses.indexOf(sel);
    document.getElementById('mes').onchange = e => { sel = e.target.value; desenhar(); };
    document.getElementById('ant').onclick  = () => { if(i < meses.length-1){ sel = meses[i+1]; desenhar(); } };
    document.getElementById('prox').onclick = () => { if(i > 0){ sel = meses[i-1]; desenhar(); } };
  }
  ligarFormularios();
}

// delegação: a tela é redesenhada a cada troca de aba/mês, então prender listener num botão
// específico o perderia na primeira troca.
document.addEventListener('click', async ev => {
  const a = ev.target.closest('[data-aba]');
  if (a){ ev.preventDefault(); aba = a.dataset.aba; location.hash = aba;
          window.scrollTo(0,0); return desenhar(); }
  // passos 2-4 do onboarding: o clique no link do grupo abre o WhatsApp em outra aba
  // E avança o pop-up (sem preventDefault de propósito)
  if (ev.target.closest('#btnGrupoOnb')) { passoOnb = 'cupom'; setTimeout(desenhar, 50); return; }
  if (ev.target.closest('#pulaGrupo'))   { passoOnb = 'cupom'; return desenhar(); }
  if (ev.target.closest('#btnCupomOk'))  { passoOnb = 'meta';  return desenhar(); }
  if (ev.target.closest('#btnFimOnb'))   { passoOnb = null;
    if (!p.end_cep){ aba = 'perfil'; location.hash = 'perfil'; window.scrollTo(0,0); }
    return desenhar(); }
  const sb = ev.target.closest('[data-sabor]');
  if (sb) { sabEscolhido = sb.dataset.sabor;
    document.querySelectorAll('[data-sabor]').forEach(b =>
      b.setAttribute('aria-pressed', b.dataset.sabor === sabEscolhido ? 'true' : 'false'));
    return; }
  const ok = ev.target.closest('#btnAceite');
  if (ok){
    ok.disabled = true; ok.textContent = 'solicitando…';
    try {
      if ((P.sabores||[]).length && !sabEscolhido){
        document.getElementById('aceiteErr').textContent = 'escolhe o sabor da sua amostra ali em cima';
        ok.disabled = false; ok.textContent = 'Solicitar amostra'; return;
      }
      const r = await fetch('/creator/aceite', {method:'POST',
        headers:{'content-type':'application/json'},
        body: JSON.stringify({ sabor: sabEscolhido })});
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.ok){ aceiteEm = P.hoje; grupoLink = j.grupo || grupoLink;
        passoOnb = 'grupo'; return desenhar(); }
      document.getElementById('aceiteErr').textContent = j.erro || 'não deu certo — tenta de novo';
    } catch(e){ document.getElementById('aceiteErr').textContent = 'sem conexão — tenta de novo'; }
    ok.disabled = false; ok.textContent = 'Solicitar amostra';
    return;
  }
  const b = ev.target.closest('.cp'); if (!b) return;
  const el = document.getElementById(b.dataset.c);
  try { await navigator.clipboard.writeText(el.value); }
  catch(e) { el.select(); document.execCommand('copy'); }
  const o = b.textContent; b.textContent = 'copiado'; setTimeout(()=>b.textContent=o, 1500);
});
window.addEventListener('hashchange', () => {
  const cru = (location.hash||'').replace('#','') || 'inicio';
  const a = APELIDO[cru] || cru;
  if (a !== aba && TELAS[a]) { aba = a; desenhar(); }
});

const val = id => (document.getElementById(id)||{}).value ?? '';

// Salva e devolve resposta na tela. Em caso de erro mostra o TEXTO do servidor: "CPF inválido"
// resolve sozinho, "não foi possível salvar" faz a pessoa tentar de novo igual e desistir.
async function enviar(url, corpo, botao, alvo, aoDarCerto){
  const b = document.getElementById(botao), m = document.getElementById(alvo);
  const rotulo = b.textContent;
  b.disabled = true; b.textContent = 'salvando…'; m.className = 'msg'; m.textContent = '';
  try {
    const r = await fetch(url, {method:'POST', headers:{'content-type':'application/json'},
                               body: JSON.stringify(corpo)});
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok){
      aoDarCerto && aoDarCerto(j);
      m.className = 'msg ok';
      m.textContent = j.campos === 0 ? 'nada mudou' : 'salvo';
      // o menu tem bolinha de pendência; redesenhar tira a bolinha na hora
      document.getElementById('menu').innerHTML = menu();
    } else {
      m.className = 'msg er';
      m.textContent = j.erro || ('erro ' + r.status);
    }
  } catch(e){ m.className = 'msg er'; m.textContent = 'sem conexão com o servidor'; }
  b.disabled = false; b.textContent = rotulo;
  setTimeout(() => { if (m.className === 'msg ok') m.textContent = ''; }, 4000);
}

// campos do perfil que os DOIS formulários de "Meus dados" mandam juntos: o endpoint grava a
// ficha inteira, então mandar só metade apagaria a outra metade.
const perfilAtual = () => ({
  nome: val('gNome'), email: val('gEmail'), telefone: val('gTel'), nascimento: val('gNasc'),
  end_cep: val('gCep'), end_uf: val('gUf'), end_logradouro: val('gLog'), end_numero: val('gNum'),
  end_complemento: val('gCompl'), end_bairro: val('gBai'), end_cidade: val('gCid'),
  end_aos_cuidados: val('gAc'),
});

function ligarFormularios(){
  const fin = document.getElementById('svFin');
  if (fin) fin.onclick = () => enviar('/creator/financeiro', {
    doc_tipo: val('fTipoDoc'), documento: val('fDoc'),
    pix_tipo: val('fPixTipo'), pix_chave: val('fPixChave') }, 'svFin', 'msgFin', () => {
      const t = val('fTipoDoc'), d = val('fDoc').replace(/\D/g,'');
      p.cpf = t === 'cpf' ? d : null; p.cnpj = t === 'cnpj' ? d : null;
      p.pix_tipo = val('fPixTipo'); p.pix_chave = val('fPixChave').trim() || null;
    });

  for (const [botao, alvo] of [['svPer','msgPer'], ['svEnd','msgEnd']]){
    const el = document.getElementById(botao);
    if (el) el.onclick = () => { const d = perfilAtual();
      enviar('/creator/perfil', d, botao, alvo, () => {
        p.nome = d.nome; p.email = d.email; p.nascimento = d.nascimento;
        p.telefone_e164 = d.telefone ? '+55'+d.telefone.replace(/\D/g,'') : null;
        p.end_cep = d.end_cep; p.end_uf = d.end_uf; p.end_logradouro = d.end_logradouro;
        p.end_numero = d.end_numero; p.end_complemento = d.end_complemento;
        p.end_bairro = d.end_bairro; p.end_cidade = d.end_cidade;
        p.end_aos_cuidados = d.end_aos_cuidados;
      }); };
  }

  const sen = document.getElementById('svSen');
  if (sen) sen.onclick = () => {
    const m = document.getElementById('msgSen');
    if (val('sNova') !== val('sConf')){
      m.className = 'msg er'; m.textContent = 'as duas senhas não são iguais'; return;
    }
    enviar('/creator/senha', {atual: val('sAtual'), nova: val('sNova')}, 'svSen', 'msgSen', () => {
      p.tem_senha = true; p.senha_provisoria = false; desenhar();
      const m2 = document.getElementById('msgSen');
      if (m2){ m2.className = 'msg ok'; m2.textContent = 'senha salva'; }
    });
  };
}

desenhar();
</script>
</body>
</html>
